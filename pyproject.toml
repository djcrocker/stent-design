[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stent-design"
version = "0.1.0"
requires-python = ">=3.11"
# Dependencies are managed by conda, not listed here —
# `pip install -e .` should not try to resolve torch/gmsh/pyvista from PyPI.

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["geom*", "sim2d*", "sim3d*", "diffusion*", "screen*", "figures*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# torch and scipy each pull in a different OpenMP runtime (libomp.dll vs libiomp5md.dll),
# and a process holding both aborts inside SuperLU with OMP Error #15. Run the torch tests 
# with an explicit path: pytest tests/test_diffusion.py
addopts = "--ignore=tests/test_diffusion.py"
markers = ["torch: needs PyTorch; must run in its own process (OpenMP clash with scipy)"]
filterwarnings = [
    # VTK sets .shape on a NumPy array, deprecated in NumPy 2.5. Third-party, fires ~19x
    # per tube test, and nothing we can fix. Silenced narrowly by message so that warnings
    # from our own code stay visible - the whole point of not blanket-ignoring.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
